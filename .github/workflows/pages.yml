name: Publish demo report

# Publishes the *synthetic demo* report to GitHub Pages.
# Nothing else is ever deployed: no real-cohort data belongs on a public site
# (see ETHICS.md §3). If you point this at real data, stop and read that first.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the demo report
        run: |
          python -m pip install -e .
          wii demo --out data/demo
          wii build --data data/demo --out site
          wii validate --data data/demo
          cp site/report.html site/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
